<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Illustration d'un accueil Android TV générique, pas une capture">
  <title>Accueil Android TV générique · illustration (pas une capture)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33404F"/>
      <stop offset="0.55" stop-color="#232D3A"/>
      <stop offset="1" stop-color="#161D27"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="tileA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#495A6E"/><stop offset="1" stop-color="#33414F"/>
    </linearGradient>
    <pattern id="wm" width="360" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <text x="0" y="110" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.055">ILLUSTRATION · PAS UNE CAPTURE</text>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#wm)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>

  <!-- generic status row -->
  <g font-family="-apple-system,'Segoe UI',Roboto,sans-serif" fill="#C9D1DC">
    <text x="64" y="72" font-size="24" fill-opacity="0.85">19:04</text>
    <g font-size="20" fill-opacity="0.55">
      <text x="950" y="70">HDMI 1</text>
      <text x="1050" y="70">Réseau</text>
      <text x="1140" y="70">Réglages</text>
    </g>
  </g>

  <!-- generic app grid -->
  <g>
    <g transform="translate(64,170)">
      <rect width="352" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#5B7089"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Vidéo</text>
    </g>
    <g transform="translate(440,170)">
      <rect width="352" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#6B6076"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Direct</text>
    </g>
    <g transform="translate(816,170)">
      <rect width="400" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#57687A"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Apps</text>
    </g>

    <g transform="translate(64,396)">
      <rect width="352" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#6A5F55"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Jeux</text>
    </g>
    <g transform="translate(440,396)">
      <rect width="352" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#4F6570"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Musique</text>
    </g>
    <g transform="translate(816,396)">
      <rect width="400" height="198" rx="8" fill="url(#tileA)"/>
      <circle cx="48" cy="52" r="17" fill="#5E5E66"/>
      <text x="32" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#AEBBCA">Réglages</text>
    </g>
  </g>

  <rect x="0" y="640" width="1280" height="80" fill="#0A0D12" fill-opacity="0.55"/>
  <text x="64" y="690" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" fill="#8D99A8">Disposition d'accueil Android TV générique · illustration, pas une capture</text>
</svg>
