name: Android CI

on:
  push:
    branches:
      - main
    # A pushed tag (v1.0.0…) also publishes a GitHub Release with both APKs.
    # Path filters are not evaluated for tag pushes.
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already provides Android command-line tools. Do not invoke
      # setup-android@v3: it tries to install the obsolete SDK package "tools".
      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The project's stable release key (create it once with tools/make-keystore.sh and store the
      # four values as repository secrets). Every Release must carry the same signature, or
      # `adb install -r` cannot update an installed canvasOS in place. The keystore is decoded
      # outside the checkout. Pull requests from forks get no secrets: they build with the debug
      # key (app/build.gradle.kts), which is fine as nothing is published from them. A tag build
      # without the key must never go on to publish a debug-signed Release.
      - name: Load the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.CANVASOS_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CANVASOS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CANVASOS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CANVASOS_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error title=Release signing key missing::Add the secrets CANVASOS_KEYSTORE_B64, CANVASOS_KEYSTORE_PASSWORD, CANVASOS_KEY_ALIAS and CANVASOS_KEY_PASSWORD (tools/make-keystore.sh prints them) before tagging. Refusing to publish a debug-signed Release."
                exit 1 ;;
            esac
            echo "::warning title=No release signing key::The signing secrets are not available to this run: its release APKs are signed with the debug key and cannot update a Release install."
            exit 0
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/canvasos.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"
          {
            echo "CANVASOS_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "CANVASOS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CANVASOS_KEY_ALIAS=$KEY_ALIAS"
            echo "CANVASOS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: JVM unit tests - standard and guard
        run: bash ./gradlew --no-daemon :app:testStandardDebugUnitTest :app:testGuardDebugUnitTest --stacktrace

      - name: Build both release APK flavors
        run: bash ./gradlew --no-daemon :app:assembleStandardRelease :app:assembleGuardRelease --stacktrace

      - name: Android lint
        run: bash ./gradlew --no-daemon :app:lintStandardRelease --stacktrace

      - name: Upload test reports and built APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*
            app/build/outputs/apk/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish a GitHub Release with both APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/standard/release/app-standard-release.apk release/canvasOS.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk release/canvasOS-guard.apk
          # Last line of defence: a Release signed with the debug key would break in-place updates.
          test -n "${CANVASOS_KEYSTORE_FILE:-}" || { echo "::error::No release signing key loaded"; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in release/canvasOS.apk release/canvasOS-guard.apk; do
            CERTS="$("$APKSIGNER" verify --print-certs "$apk")"
            echo "$apk: $(echo "$CERTS" | grep 'certificate SHA-256')"
            if echo "$CERTS" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done
          gh release create "$GITHUB_REF_NAME" release/canvasOS.apk release/canvasOS-guard.apk \
            --title "canvasOS $GITHUB_REF_NAME" \
            --notes "canvasOS.apk : version standard. canvasOS-guard.apk : version pour TCL (voir AGENTS.md). Les APK sont signés avec la clé stable du projet : adb install -r met à jour sur place, sans rien désinstaller, depuis toute version publiée après ce changement. Seule une installation venue d'une ancienne version signée avec la clé debug, ou d'un APK compilé localement, demande une désinstallation unique avant (adb uninstall com.getisolated.canvasos). Depuis cette version, canvasOS se met aussi à jour tout seul : Réglages de l'accueil → Système → Mise à jour."
